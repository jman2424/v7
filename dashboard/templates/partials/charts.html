<div class="charts">
  <section class="card chartCard">
    <div class="hd"><div class="h">Message Volume</div><div class="sub" id="kpi-sub">—</div></div>
    <div class="bd"><div class="canvasWrap"><canvas id="chart-volume"></canvas></div></div>
  </section>

  <section class="card chartCard">
    <div class="hd"><div class="h">Channels</div><div class="sub">outbound split</div></div>
    <div class="bd"><div class="canvasWrap"><canvas id="chart-channels"></canvas></div></div>
  </section>

  <section class="card chartCard">
    <div class="hd"><div class="h">Top Intents</div><div class="sub">distribution</div></div>
    <div class="bd"><div class="canvasWrap"><canvas id="chart-intents"></canvas></div></div>
  </section>

  <section class="card chartCard">
    <div class="hd"><div class="h">Fallbacks</div><div class="sub">count</div></div>
    <div class="bd"><div class="canvasWrap"><canvas id="chart-fallbacks"></canvas></div></div>
  </section>

  <section class="card chartCard">
    <div class="hd"><div class="h">Errors</div><div class="sub">count</div></div>
    <div class="bd"><div class="canvasWrap"><canvas id="chart-errors"></canvas></div></div>
  </section>

  <section class="card chartCard">
    <div class="hd"><div class="h">Sessions</div><div class="sub">unique</div></div>
    <div class="bd"><div class="canvasWrap"><canvas id="chart-sessions"></canvas></div></div>
  </section>
</div>
