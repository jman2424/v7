<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ tenant }} — Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token or '' }}" />

  <style>
    :root{
      --bg0:#060812;
      --bg1:#0b1020;
      --panel: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.46);
      --radius: 12px;
      --gap: 8px;
      --pad: 10px;
      --shadow: 0 16px 46px rgba(0,0,0,.55);
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    html, body { height: 100%; }
    body{
      margin:0;
      height:100%;
      overflow:hidden; /* ✅ whole page never scrolls */
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
      font-family: var(--font);
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(780px 520px at 12% 12%, rgba(110,231,255,.12), transparent 60%),
        radial-gradient(780px 520px at 85% 18%, rgba(167,139,250,.12), transparent 60%),
        radial-gradient(780px 520px at 70% 92%, rgba(52,211,153,.08), transparent 60%);
      transform: translateZ(0);
    }

    /* =========================================
       ✅ NAVBAR / LOGO FORCE-FIX (your partial)
       ========================================= */
    /* If your partial uses <nav> or .navbar etc, this clamps it */
    nav, .navbar, .top-nav, header{
      max-height: 44px !important;
      height: 44px !important;
      overflow: hidden !important;
      padding: 6px 10px !important;
      margin: 0 !important;
      display:flex !important;
      align-items:center !important;
      border-bottom: 1px solid rgba(255,255,255,.06) !important;
      background: rgba(0,0,0,.12) !important;
      backdrop-filter: blur(10px) !important;
    }

    /* Kill huge logo blocks */
    nav img, header img, .navbar img,
    nav svg, header svg, .navbar svg{
      width: 22px !important;
      height: 22px !important;
      max-width: 22px !important;
      max-height: 22px !important;
    }

    /* Kill giant brand text */
    nav .brand, header .brand, .navbar .brand,
    nav .logo, header .logo, .navbar .logo{
      font-size: 12px !important;
      font-weight: 900 !important;
      line-height: 1 !important;
    }

    /* If the partial has a left sidebar-ish block, nuke it */
    .sidebar, .side, .drawer, .nav-left, .brand-block{
      height: 44px !important;
      max-height: 44px !important;
      padding: 0 10px !important;
    }

    /* =========================================
       ✅ APP LAYOUT
       ========================================= */
    .app{
      height:100vh;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    /* If navbar partial exists, it sits above this main.
       Main must take remaining height. */
    .main{
      flex: 1 1 auto;
      min-height: 0;        /* ✅ key for internal scroll areas */
      padding: 8px 10px 10px;
      display:flex;
      flex-direction:column;
      gap: var(--gap);
    }

    .card{
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--pad);
      min-height: 0;
    }
    .card h2{
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing:.2px;
      color: rgba(255,255,255,.78);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 8px;
    }
    .subtle{ font-size: 10px; color: var(--muted); font-weight: 850; text-transform:none; }

    /* KPI strip */
    .kpis{
      display:grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 6px;
    }
    .kpi{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius: 10px;
      padding: 8px;
      display:flex;
      flex-direction:column;
      gap: 2px;
      min-height: 52px;
    }
    .kpi .k{ font-size: 9px; font-weight: 950; color: var(--muted2); text-transform:uppercase; letter-spacing:.18px; }
    .kpi .v{ font-size: 16px; font-weight: 1000; line-height:1.05; }
    .kpi .s{ font-size: 10px; color: var(--muted); font-weight: 800; }

    /* Top controls row inside KPI card */
    .kpiRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      flex-wrap:wrap;
    }
    .controls{
      display:flex;
      align-items:center;
      gap: 8px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .pill{
      display:flex;
      align-items:center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
    }
    .pill label{
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing:.18px;
      color: var(--muted2);
    }
    .pill select{
      border:0;
      outline:0;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      font-weight: 950;
      cursor: pointer;
    }
    .btn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 950;
      font-size: 11px;
      cursor:pointer;
      letter-spacing:.12px;
      white-space:nowrap;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }

    /* ✅ The grid must fill remaining space and NOT exceed it */
    .grid{
      flex: 1 1 auto;
      min-height: 0;
      display:grid;
      grid-template-columns: 1.35fr .65fr;
      grid-template-rows: minmax(0,1fr) minmax(0,1fr); /* ✅ equal height rows */
      gap: var(--gap);
    }

    .panelFill{
      height: calc(100% - 18px); /* title space */
      min-height: 0;
    }

    .chartbox{
      height: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      padding: 6px;
    }

    .tablewrap{
      height: 100%;
      border-radius: 10px;
      overflow:auto; /* ✅ scroll INSIDE only */
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
    }

    table{ width:100%; border-collapse: collapse; font-size:11px; }
    th{
      position: sticky; top: 0;
      padding: 8px;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing:.18px;
      color: rgba(255,255,255,.75);
      background: rgba(10,12,22,.95);
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align:left;
      white-space:nowrap;
      z-index: 2;
    }
    td{
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      color: rgba(255,255,255,.88);
      vertical-align: top;
      word-break: break-word;
      line-height:1.2;
    }

    /* Mobile fallback: allow scroll (inevitable) */
    @media (max-width: 980px){
      body{ overflow:auto; }
      .main{ overflow:auto; }
      .grid{
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .kpis{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
  </style>
</head>

<body data-tenant="{{ tenant }}" data-role="{{ role }}" data-session="{{ session_id }}">
  {% include 'partials/_navbar.html' ignore missing %}

  <div class="app">
    <div class="main">

      <section class="card">
        <div class="kpiRow">
          <h2 style="margin:0;">KPIs <span class="subtle" id="kpi-sub">—</span></h2>
          <div class="controls">
            <div class="pill">
              <label for="period">Period</label>
              <select id="period">
                <option value="60">60m</option>
                <option value="1440" selected>24h</option>
                <option value="10080">7d</option>
                <option value="43200">30d</option>
              </select>
            </div>
            <button id="refresh" class="btn" type="button">Refresh</button>
            <button id="export" class="btn" type="button">Export CSV</button>
          </div>
        </div>

        <div class="kpis" style="margin-top:8px;">
          <div class="kpi"><div class="k">Inbound</div><div class="v" id="kpi-in">0</div><div class="s">recv</div></div>
          <div class="kpi"><div class="k">Outbound</div><div class="v" id="kpi-out">0</div><div class="s">sent</div></div>
          <div class="kpi"><div class="k">Total</div><div class="v" id="kpi-total">0</div><div class="s">msgs</div></div>
          <div class="kpi"><div class="k">Sessions</div><div class="v" id="kpi-sessions">0</div><div class="s">uniq</div></div>
          <div class="kpi"><div class="k">Fallbacks</div><div class="v" id="kpi-fb">0</div><div class="s">def</div></div>
          <div class="kpi"><div class="k">Errors</div><div class="v" id="kpi-err">0</div><div class="s">pipe</div></div>
        </div>
      </section>

      <div class="grid">
        <!-- Row 1 -->
        <section class="card" style="min-height:0;">
          <h2>Volume</h2>
          <div class="panelFill">
            <div class="chartbox"><canvas id="chart-volume"></canvas></div>
          </div>
        </section>

        <section class="card" style="min-height:0;">
          <h2>Channels</h2>
          <div class="panelFill">
            <div class="chartbox"><canvas id="chart-channels"></canvas></div>
          </div>
        </section>

        <!-- Row 2 -->
        <section class="card" style="min-height:0;">
          <h2>Common Questions</h2>
          <div class="panelFill">
            <div class="tablewrap">
              <table>
                <thead><tr><th>Question</th><th style="width:90px;">Count</th></tr></thead>
                <tbody id="tbl-questions"><tr><td colspan="2">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="card" style="min-height:0;">
          <h2>Intents / Fallbacks / Errors <span class="subtle" id="mini-status">—</span></h2>
          <div class="panelFill" style="display:grid; grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: var(--gap); min-height:0;">
            <div class="chartbox"><canvas id="chart-intents"></canvas></div>
            <div class="chartbox" style="display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap); min-height:0;">
              <div class="chartbox" style="padding:6px;"><canvas id="chart-fallbacks"></canvas></div>
              <div class="chartbox" style="padding:6px;"><canvas id="chart-errors"></canvas></div>
            </div>
          </div>
        </section>
      </div>

    </div>
  </div>

  <script>
    (function () {
      const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || "";
      const tenant = document.body?.dataset?.tenant || "{{ tenant }}";
      window.__ADMIN__ = { csrfToken: csrf, tenant };
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { charts: {} };

    function int(n){ n = Number(n); return Number.isFinite(n) ? Math.trunc(n) : 0; }

    function headers(){
      const h = {};
      if (window.__ADMIN__?.csrfToken) h["X-CSRF-Token"] = window.__ADMIN__.csrfToken;
      return h;
    }

    async function getJSON(url){
      const res = await fetch(url, { credentials:"include", headers: headers() });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      if(!res.ok){
        const err = new Error(`HTTP ${res.status} ${url}`);
        err.payload = data;
        throw err;
      }
      return data;
    }

    function destroyChart(key){
      if(state.charts[key]){ state.charts[key].destroy(); delete state.charts[key]; }
    }

    function renderBar(canvasId, key, labels, values){
      destroyChart(key);
      state.charts[key] = new Chart($(canvasId), {
        type: "bar",
        data: { labels, datasets: [{ label: "Count", data: values.map(int) }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { callback: (v)=>int(v) } } }
        }
      });
    }

    function renderPie(canvasId, key, labels, values){
      destroyChart(key);
      state.charts[key] = new Chart($(canvasId), {
        type: "pie",
        data: { labels, datasets: [{ data: values.map(int) }] },
        options: { responsive:true, maintainAspectRatio:false }
      });
    }

    function renderLine(canvasId, key, labels, inbound, outbound){
      destroyChart(key);
      state.charts[key] = new Chart($(canvasId), {
        type: "line",
        data: {
          labels,
          datasets: [
            { label: "Inbound", data: inbound.map(int), tension: 0.25 },
            { label: "Outbound", data: outbound.map(int), tension: 0.25 }
          ]
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          plugins: { legend: { display: true } },
          scales: { y: { beginAtZero:true, ticks:{ callback:(v)=>int(v) } } }
        }
      });
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderQuestions(items){
      const tbody = $("tbl-questions");
      if(!items || !items.length){
        tbody.innerHTML = `<tr><td colspan="2">No questions yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = items.slice(0,50).map(x =>
        `<tr><td>${escapeHtml(x.text || "")}</td><td>${int(x.count)}</td></tr>`
      ).join("");
    }

    function showErr(e){
      $("mini-status").textContent = "ERROR";
      console.error(e);
    }

    async function refreshAll(){
      const minutes = parseInt($("period").value || "1440", 10);
      const tenant = encodeURIComponent(window.__ADMIN__.tenant || "default");
      $("mini-status").textContent = "Loading…";

      const [k, ts, ins] = await Promise.all([
        getJSON(`/admin/api/kpis?minutes=${minutes}&tenant=${tenant}`),
        getJSON(`/admin/api/timeseries?minutes=${minutes}&bucket=60&tenant=${tenant}`),
        getJSON(`/admin/api/insights?minutes=${minutes}&top=25&tenant=${tenant}`),
      ]);

      $("kpi-in").textContent = int(k.inbound);
      $("kpi-out").textContent = int(k.outbound);
      $("kpi-total").textContent = int(k.total_messages);
      $("kpi-sessions").textContent = int(k.sessions);
      $("kpi-fb").textContent = int(k.fallbacks);
      $("kpi-err").textContent = int(k.errors);
      $("kpi-sub").textContent = `Last ${int(k.minutes)}m`;

      const labels = (ts.points || []).map(p => (p.t || "").slice(11,16));
      renderLine("chart-volume", "volume", labels,
        (ts.points || []).map(p => p.inbound),
        (ts.points || []).map(p => p.outbound)
      );

      const ch = (ins.channels || []);
      renderPie("chart-channels", "channels", ch.map(x=>x.key), ch.map(x=>x.count));

      const intents = (ins.intents || []);
      renderBar("chart-intents", "intents", intents.map(x=>x.key), intents.map(x=>x.count));

      const fbs = (ins.fallbacks || []);
      renderBar("chart-fallbacks", "fallbacks", fbs.map(x=>x.key), fbs.map(x=>x.count));

      const errs = (ins.errors || []);
      renderBar("chart-errors", "errors", errs.map(x=>x.key), errs.map(x=>x.count));

      renderQuestions(ins.common_questions || []);

      $("mini-status").textContent = "OK";
    }

    window.addEventListener("DOMContentLoaded", () => {
      $("refresh").addEventListener("click", () => refreshAll().catch(showErr));
      $("period").addEventListener("change", () => refreshAll().catch(showErr));
      $("export").addEventListener("click", () => {
        const tenant = encodeURIComponent(window.__ADMIN__.tenant || "default");
        window.location.href = `/admin/api/leads.csv?tenant=${tenant}`;
      });
      refreshAll().catch(showErr);
    });
  </script>
</body>
</html>
