{% extends 'dashboard.html' %}
{% block content %}
<section class="card">
<div class="section-heading"><h2>{{ page_title }}</h2><button id="load-resource" class="btn btn-quiet" type="button">Reload saved data</button></div>
{% if page == 'settings' %}
<label for="resource">Settings section</label><select id="resource"><option value="branding.json">Branding & approved websites</option><option value="overrides.json">Agent configuration</option><option value="synonyms.json">Search vocabulary</option></select>
{% else %}
<select id="resource" aria-label="Business resource" hidden><option value="{{ resource_file }}">{{ page_title }}</option></select>
{% endif %}
<form id="business-form"><div id="business-editor"></div>
<div class="save-bar"><span id="resource-status" role="status">Loading saved data…</span><button id="save-resource" class="btn" type="submit" disabled>Save changes</button></div>
</form>
</section>
<details class="advanced"><summary>Advanced: edit structured JSON</summary><p>For custom fields and advanced configuration. Changes are validated when saved.</p><textarea id="resource-json" aria-label="Business data JSON" rows="12" spellcheck="false"></textarea><button id="use-json" type="button" class="btn btn-quiet">Apply JSON to form</button></details>
{% endblock %}
