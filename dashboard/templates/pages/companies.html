{% extends 'dashboard.html' %}
{% block content %}
<section id="platform-panel" class="card">
<div class="section-heading"><h2>Your companies</h2><span id="company-count" class="muted"></span></div>
<p id="platform-status" class="status" role="status">Loading…</p>
<div class="table-scroll"><table><thead><tr><th>Company</th><th>Agent mode</th><th>Messages</th><th>Errors</th><th>Status & action</th></tr></thead><tbody id="companies"></tbody></table></div>
<div class="pagination"><button id="companies-prev" class="btn btn-quiet" type="button">Previous</button><button id="companies-next" class="btn btn-quiet" type="button">Next</button></div>
<p class="muted">Company status reflects recorded activity and configuration checks.</p>
</section>
{% endblock %}
