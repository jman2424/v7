services:
  - type: web
    name: ai-sales-assistant
    env: python
    plan: starter
    disk:
      name: v7-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -c gunicorn.conf.py 'app:create_app()'"
    envVars:
      - key: MODE
        value: V7
      - key: BUSINESS_KEY
        value: EXAMPLE
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: V7_DATA_DIR
        value: /var/data
      - key: ANALYTICS_DB_PATH
        value: /var/data/logs/analytics.db
      - key: CRM_SNAPSHOT_PATH
        value: /var/data/logs/crm_snapshot.json
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SHEETS_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true
