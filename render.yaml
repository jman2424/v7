services:
  - type: web
    name: ai-sales-assistant
    env: python
    plan: starter
    buildCommand: "pip install -r requirement.txt"
    startCommand: "gunicorn -c gunicorn.conf.py 'app:create_app()'"
    envVars:
      - key: MODE
        value: AIV7
      - key: BUSINESS_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: SECRET_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_USERS_FILE
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SHEETS_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true
