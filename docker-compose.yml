version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asa_app
    env_file:
      - .env
    environment:
      - BIND=0.0.0.0:10000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "10000:10000"
    volumes:
      - ./business:/app/business
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: gunicorn -c gunicorn.conf.py "app:create_app()"
    restart: unless-stopped

