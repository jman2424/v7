openapi: 3.0.3
info:
  title: AI Sales Assistant API
  version: "0.1.0"
  description: |
    Public chat endpoint, admin JSON APIs, analytics, and WhatsApp webhook.

servers:
  - url: https://your-app.example.com
  - url: http://localhost:10000

tags:
  - name: Health
  - name: Chat
  - name: Admin
  - name: Analytics
  - name: Webhooks

paths:
  /admin/api/offers:
    parameters:
      - in: query
        name: tenant
        schema: { type: string }
        description: Must be a company authorized for the signed-in account.
    get:
      tags: [Admin]
      summary: Read current and archived company offers
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Offer array, including archived entries; see offers.schema.json for fields.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { type: object }
        "401": { description: Authentication required }
        "403": { description: Company access denied }
    put:
      tags: [Admin]
      summary: Replace company offers with validated and audited data
      description: >-
        Up to 50 unarchived and 500 total entries. Existing custom offers remain valid.
        New optional fields are archived, deal_type (custom, buy_one_get_one, minimum_spend),
        minimum_spend, discount_type (percentage, fixed) and discount_value.
        BOGO requires product_skus and means one free item of the same SKU per purchased item.
        Minimum-spend deals require a positive GBP threshold and discount, up to two decimals.
        Percentage discounts cannot exceed 100; fixed discounts cannot exceed the threshold.
        Set archived=true and keep the entry to preserve history. Details are defined in offers.schema.json.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items: { type: object }
      responses:
        "200": { description: Saved, with ok and snapshot fields }
        "400": { description: Invalid schema or deal constraints; no save }
        "401": { description: Authentication required }
        "403": { description: Company access denied or invalid CSRF token }
  /admin/api/statistics:
    get:
      tags: [Admin]
      summary: Company statistics including offer engagement
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - in: query
          name: channel
          schema: { type: string, enum: [all, web, whatsapp], default: all }
      responses:
        "200":
          description: Existing statistics plus the additive offers report. No redemption or revenue attribution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: object
                    properties:
                      offer_replies: { type: integer, minimum: 0 }
                      conversations: { type: integer, minimum: 0 }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            status: { type: string, enum: [active, paused, scheduled, expired, archived, removed] }
                            deal_type: { type: string }
                            terms: { type: string }
                            replies: { type: integer, minimum: 0 }
                            conversations: { type: integer, minimum: 0 }
        "400": { description: Invalid date or channel filter }
        "401": { description: Authentication required }
        "403": { description: Company access denied }
  /health:
    get:
      tags: [Health]
      summary: Liveness/Readiness
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /chat_api:
    post:
      tags: [Chat]
      summary: Send a message to the assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Bad request
        "429":
          description: Rate limited

  /admin/api/leads:
    get:
      tags: [Admin]
      summary: List leads (requires auth)
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items: { $ref: "#/components/schemas/Lead" }

  /admin/api/catalog:
    put:
      tags: [Admin]
      summary: Replace catalog.json (validated + versioned)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, catalog]
              properties:
                tenant: { type: string }
                catalog:
                  $ref: "#/components/schemas/Catalog"
      responses:
        "200":
          description: Accepted + snapshot reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  snapshot_path: { type: string }

  /analytics/export.csv:
    get:
      tags: [Analytics]
      summary: Export analytics as CSV
      parameters:
        - in: query
          name: tenant
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /whatsapp/webhook:
    get:
      tags: [Webhooks]
      summary: Webhook verification
      parameters:
        - in: query
          name: "hub.mode"
          schema: { type: string }
        - in: query
          name: "hub.verify_token"
          schema: { type: string }
        - in: query
          name: "hub.challenge"
          schema: { type: string }
      responses:
        "200":
          description: Challenge echo
          content:
            text/plain:
              schema: { type: string }
    post:
      tags: [Webhooks]
      summary: WhatsApp inbound messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw WhatsApp payload (forwarded to router)
      responses:
        "200":
          description: Acknowledge receipt

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        session_id: { type: string }
        channel:
          type: string
          enum: [web, wa, api]
          default: web
        tenant: { type: string }
        metadata:
          type: object
          additionalProperties: true

    ChatResponse:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
        raw:
          description: Implementation-specific details (optional)
          type: object
          additionalProperties: true
        _latency_ms: { type: number }

    Lead:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        tags:
          type: array
          items: { type: string }
        last_seen: { type: string, format: date-time }
        channel: { type: string, enum: [web, wa, api] }
        status: { type: string, enum: [new, active, won, lost] }

    Catalog:
      $ref: "#/components/schemas/CatalogInternal"

    CatalogInternal:
      type: object
      required: [version, categories]
      properties:
        version: { type: integer, minimum: 1 }
        categories:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, name, items]
            properties:
              id: { type: string }
              name: { type: string }
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [sku, name, price]
                  properties:
                    sku: { type: string }
                    name: { type: string }
                    price: { type: number, minimum: 0 }
                    unit: { type: string }
                    tags:
                      type: array
                      items: { type: string }
                    in_stock: { type: boolean }
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          value: { type: string }
